<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deployed with DevOps</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fb; color: #172033; }
    main { max-width: 680px; margin: 24px; padding: 40px; background: white; border-radius: 18px; box-shadow: 0 12px 36px #17203318; }
    h1 { margin-top: 0; } p { line-height: 1.6; }

<body>
  <main>
    <h1>Hello from AWS!</h1>

    <p>Build • Automate • Deploy</p>
  </main>
</body>
</html>
